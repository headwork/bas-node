# deploy_shore.yaml
name: "Deploy MFM.SHORE"
project: "hlngs"
project_name: "MFM.Shore"
project_name2: "MFM.SHORE"
notify_tag: "WESYS"

environment: "dev"
deploy_root: "D:/Deploy"
project_root: "${deploy_root}/hlngs"
git_url: "http://112.217.163.10:16784/WeSys.git"

# ─────────────────────────────────────────────────────────────────────────────
# 서버 환경
# ─────────────────────────────────────────────────────────────────────────────
server_list:
  local: &local_jenkins
    server_name: "local_jenkins"
    source_path: "${deploy_root}/jenkins_home/workspace/hlngsGitPullRelease"
    build_root: "${project_root}/build"               # 산출물 루트. 폴더명은 target 이 붙인다
    profile_dir: "${project_root}/config"             # yaml · 빌드 스크립트 · pubxml 이 사는 곳

    build_cwd: "${source_path}/${project_name}/Web"
    build_cmd: "\"${profile_dir}\\build_shore.bat\" \"${build_profile}\" \"${build_path}\""

    # 이 블록은 배포 대상으로도 쓰인다(dev). 그때 필요한 값들.
    web_deploy_path: "${deploy_root}/${project_name}_QA"    # 라이브 폴더 = 웹서버 physicalPath
    backup_root: "${deploy_root}/_backup"             # 백업 보관 폴더. 라이브와 같은 볼륨이어야 한다

    web_server_type: "iis"
    web_server_name: "${project_name2}_QA"            # 생략하면 web_deploy_path 끝 폴더명으로 유추
    # web_server_pool: "MFM.SHORE_QA"                 # 앱풀명이 사이트명과 다를 때만
    health_url: "https://localhost:8443/healthz"

  local_prod: &local_jenkins_prod
    <<: *local_jenkins
    source_path: "${deploy_root}/jenkins_home/workspace/hlngsGitPull"
    web_server_name: "${project_name2}"

  qa_server: &qa_server
    server_name: "qa_deploy"
    ssh:
      host: "221.139.50.188"
      port: 9222
      user: "administrator"
      key_path: "C:/Users/HSK_2017/.ssh/hlng_web_rsa"

    upload_path: "D:/HLNGS/build"                # 압축파일·배포 스크립트가 도착할 원격 폴더
    web_deploy_path: "D:/Deploy/${project_name}_QA"    # 원격 라이브 폴더 = 웹서버 physicalPath
    backup_root: "D:/HLNGS/backup"               # 백업 보관 폴더. 라이브와 같은 볼륨이어야 한다
    web_server_type: "iis"
    web_server_name: "${project_name2}"
    health_url: "https://wesysqa.hls.co.kr/healthz"

  prod_server: &prod_server
    <<: *qa_server
    server_name: "prod_deploy"
    web_deploy_path: "D:/Deploy/${project_name}"
    web_server_name: "${project_name2}"
    health_url: "https://wesys.hls.co.kr/healthz"


# ─────────────────────────────────────────────────────────────────────────────
# target 은 조합표다 — 어느 빌드서버에서 만들어 어느 배포서버로 보낼지.
# 여기 직접 적은 값이 서버 블록을 이긴다(부분 덮어쓰기).
#
# 엔진은 환경 이름(dev·qa·prod)을 보지 않는다. 갈래는 아래 설정값이 정한다.
#
#   build_server    어디서 빌드하나
#   deploy_server   어디에 배포하나 (로컬이든 원격이든 반드시 적는다)
#   deploy_remote   true 면 deploy_server 에 원격접속해서 배포한다. 생략 시 true
#   compress        생략 시 true. 원격 배포는 zip 하나로 보내므로 끌 수 없다
#   telegram        공지를 **보낼지**만 정한다. 어떻게 보낼지(젠킨스 잡 경유 여부·토큰·
#                   채팅방)는 config/<project>.json 의 telegram 블록이 쥔다 —
#                   서버마다 다른 인프라 정보라 프로젝트를 따라다니는 yaml 에 두지 않는다
# ─────────────────────────────────────────────────────────────────────────────
target:
  dev:
    branch: "deploy/qa"
    build_server: *local_jenkins
    # ⚠️ 폴더 이름은 **여기가 정본**이다. build_shore.bat 이 프로파일 사본의 PublishUrl 을
    #    이 값으로 덮으므로 pubxml 과 어긋날 일이 없다.
    build_path: "${build_root}/${project_name}_QA"
    build_profile: "${profile_dir}/wesysProfileDev.pubxml"

    deploy_server: *local_jenkins
    deploy_remote: false        # 이 서버 안에서 끝낸다
    compress: false             # 690MB 를 zip 하는 데 약 7분. 로컬은 zip 을 쓰지 않는다
    confluence: false
    telegram: false

  qa:
    branch: "deploy/qa"
    build_server: *local_jenkins
    build_path: "${build_root}/${project_name}_QA"
    build_profile: "${profile_dir}/wesysProfileQA.pubxml"

    deploy_server: *qa_server
    confluence: false
    telegram: false

  prod:
    branch: "master"
    build_server: *local_jenkins_prod
    build_path: "${build_root}/${project_name}"
    build_profile: "${profile_dir}/wesysProfilePord.pubxml"

    deploy_server: *prod_server
    confluence: false
    telegram: true

# ─────────────────────────────────────────────────────────────────────────────
# 서버 설정 보전
#
# 배포는 폴더를 통째로 갈아끼운다. 그냥 두면 소스에 든 설정이 서버 설정을 덮는다.
#
#   exclude          빌드가 끝나면 산출물에서 지운다. 소스 설정은 서버까지 가지도 않는다
#   preserve_config  라이브의 설정을 새 배포본으로 옮긴다. IIS 정지 **전**에 끝낸다
#   config_backup    옮긴 설정의 사본을 두는 곳
#
# ─────────────────────────────────────────────────────────────────────────────
exclude:
  - "appsettings*.json"    # 산출물 루트만 본다. 하위 폴더는 훑지 않는다
  - "web.config"
  
preserve_config:
  - "web.config"           # exclude 하지 않는다 - 없으면 IIS 가 500.19 로 뜬다
  - "appsettings.json"

# 옮긴 설정의 사본. **백업 폴더 안에 두지 않는다** — 백업은 보관정책이 지우는 곳이라
# 사본이 같이 사라지면 다음 배포가 라이브만 보게 된다.
# 사이트별로 나눈다: 한 서버에 QA·운영이 같이 살면 파일 이름이 겹친다.
config_backup: "${project_root}/server_config/${web_server_name}"

# 운영 중 생성되어 배포 뒤에도 유지해야 하는 항목 (업로드 폴더 · 캐시 등).
# **배포와 롤백에 똑같이 적용된다.** 롤백은 코드를 옛것으로 되돌릴 뿐 데이터는 현재 것이다 —
# 현재 라이브에서 복원할 판으로 옮긴 뒤에 라이브 자리에 넣는다.
# preserve_config 와 시점이 다르다 — 이쪽은 **웹서버를 내린 뒤**에 옮긴다.
# 서비스가 살아 있으면 그 파일들이 쓰이는 중이라 사본이 찢어진다.
#
# ⚠️ 이름에 **공백·쉼표·세미콜론·와일드카드를 쓰지 않는다.** 스크립트가 그 자리에서
#    목록을 쪼개므로 이름이 갈라지고, 갈라진 이름은 "이전 배포본에 없음" 으로
#    건너뛰어진다 — **배포는 성공하고 데이터만 사라진다.** 도구가 조립할 때 막는다.
# preserve:
#   - "uploads"
#   - "Temp"

# 백업 보관 정책. 배포 성공 직후 자동 적용된다 (로컬·원격 모두).
# 이 개수가 곧 `--rollback=N` 의 N 상한이다 — 남기지 않은 것은 되돌릴 수 없다.
backup:
  keep_count: 3            # 최근 성공 배포 3건의 백업만 남긴다 (1회 690MB)
  dry_run: false           # true 로 두면 삭제 대상만 출력하고 지우지 않는다

# ─────────────────────────────────────────────────────────────────────────────
# stages 에는 설정을 두지 않는다 — 순서 · 그룹 · 갈래만이다.
# 경로·명령·주소는 전부 server_list / target 에서 온다.
#
# group 은 --only 로 나눠 실행할 단위다. 젠킨스가 그룹마다 따로 호출하면
# 각 단계의 성공/실패가 stage view 에 그대로 보인다.
#   basDeploy.bat --yaml=... --only=git_check --deploy-key=<키>
# 같은 deploy_key 를 넘겨야 앞 단계의 판정(changed_static_only 등)이 이어진다.
# ─────────────────────────────────────────────────────────────────────────────
stages:
  - git_sync:
      group: git_check                                   # branch·source_path 를 읽어 동기화
      # 정적 판정 기준. 변경이 전부 이 아래면 `changed_static_only` 가 참이 되고
      # 빌드가 아래 정적 갈래로 간다. 경로는 **저장소 루트 기준**이다.
      #
      # ⚠️ 이 목록이 없으면 분류를 아예 하지 않는다 — 판정이 **항상 거짓**이 되어
      #    정적만 바뀌어도 전체 빌드가 돈다. 에러는 나지 않는다(GitSyncStage.classify).
      static_paths:
        - "MFM.Shore/Web/Views/"
        - "MFM.Shore/Web/wwwroot/"
        - "MFM.Shore/Web/Template/"

  # 빌드는 두 갈래다. 조건이 stages 에 드러나므로 `--dry-run` 으로 어느 쪽인지 미리 본다.
  # 판정은 node(git_sync)가 하고 bat 은 시키는 대로만 한다 — bat 이 도달하는 시점에는
  # pull 이전 커밋이 이미 사라져서 스스로 판정할 근거가 없다.
  #
  # 둘 다 build 스테이지라 산출물 갱신 검사를 똑같이 받는다(BuildStage.#verifyOutput).
  # 정적 갈래가 복사에 실패하면 낡은 산출물이 새것인 척 배포되는 대신 배포가 멈춘다.
  #
  # ⚠️ 이월이 끊겨 `changed_static_only` 가 미정의가 되면 **전체 빌드 쪽**이 선택된다
  #    (PipelineEngine.isTruthy 는 undefined 를 거짓으로 본다). 느려질 뿐 틀리지 않는다.
  - build:
      group: build                                       # build_cwd·build_cmd·build_profile
      unless: changed_static_only
  - build:
      group: build                                       # 정적만 변경 - 빌드 대신 복사
      if: changed_static_only
      cmd: "\"${profile_dir}\\copy_static_shore.bat\" \"${build_path}\""

  # 정지 → 백업 → 스왑 → 시작은 **스크립트 한 번**이다(deploy.bat). 쪼개지 않는 이유는
  # 두 move 사이에 라이브 폴더가 존재하지 않기 때문이다 — 그 구간이 벌어져 있으면
  # 끊긴 연결이 곧 "라이브 없음" 이 되고 되돌릴 주체가 없다. 원격·로컬이 같은 스크립트다.
  - archive:       { group: build,  if: compress }       # build_path -> _artifacts/*.zip
  - remote_deploy: { group: deploy, if: deploy_remote }  # 스크립트동기화 -> scp -> 해제 -> deploy.bat
  - health_check:  { group: deploy, if: deploy_remote }  # health_url
  - local_deploy:  { group: deploy, unless: deploy_remote }   # 산출물복사 -> 설정보전 -> deploy.bat
  - confluence:    { group: deploy }                     # confluence: true 인 경우만 동작

# 배포가 실패하면 실행된다. 백업 폴더로 라이브를 되돌린다.
# 백업이 없으면(라이브를 건드리기 전에 실패) 아무것도 하지 않는다.
#
# 젠킨스 롤백 잡에서 직접 부를 수도 있다. 그때는 배포 이력에서 골라 되돌린다.
#   basDeploy.bat --yaml=... --rollback=1     1 = 직전 성공 배포 (최대 backup.keep_count)
#   basDeploy.bat --yaml=... --rollback=1 --dry-run    되돌릴 후보만 출력
#
# 라이브 옆에 남는 것
#   배포중 롤백   실패한 배포본을 <라이브>_failed_<시각> 으로 남긴다. 다음 배포가 성공하면 지운다.
#   강제 롤백     밀려난 라이브는 서비스가 다시 뜨면 바로 지운다(앞으로 갈 사본은 배포 zip 이다).
#                 지우지 못하면 <라이브>_replaced_<시각> 으로 남고, 다음 배포 성공 때 지운다.
#   backup.enabled:false · dry_run:true 면 이 정리도 하지 않는다.
# TODO: 백업 폴더 대신 git commit id 로 재배포하는 방식을 추가할 예정
rollback:
  - local_rollback:  { unless: deploy_remote }
  - remote_rollback: { if: deploy_remote }
